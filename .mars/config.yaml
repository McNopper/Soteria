# Soteria MARS Project Configuration
# ---------------------------------------------------------------------------
# This file lives inside the Soteria project (.mars/config.yaml).
# Everything in here is Soteria-specific.  Generic workflow logic (process
# definitions, personas, termination policies) lives in MARS itself.
#
# Usage
# -----
#   mars-server --project-config D:/Development/GitHub/Soteria/.mars/config.yaml
#
# Or interactively from the MARS CLI:
#   /spawn coordinator
#   /skill load_project {"config_path": "D:/Development/GitHub/Soteria/.mars/config.yaml"}
#   /skill run_all
# ---------------------------------------------------------------------------

project: soteria
title: "Soteria v1.0 — Safety-Critical Vulkan SC Rendering Engine (ASIL-D)"

# ---------------------------------------------------------------------------
# Functional Safety Target
# ---------------------------------------------------------------------------
# ISO 26262 (Road vehicles – Functional safety), ASIL-D
# Reference: https://www.tuv.com/germany/de/funktionale-sicherheit-in-automotive.html
# Vulkan SC is designed to enable ISO 26262 ASIL-D certification:
#   https://www.khronos.org/vulkansc/
#
# ASIL-D requirements (highest automotive safety integrity level):
#   - Systematic error avoidance: most stringent measures required
#   - Hardware fault tolerance: SPFM >= 99%, LFM >= 90%
#   - Software safety requirements fully derived from safety goals
#   - Formal methods and design verification required
#   - MC/DC structural coverage required for all safety-relevant code
#   - Independence: tester fully independent from developer (different team)
#   - Full traceability from safety goal → safety requirement → design → test
#   - Assessment by an organisationally independent party required

# ---------------------------------------------------------------------------
# Coordinator LLM
# ---------------------------------------------------------------------------
coordinator:
  provider: copilot/gpt-4o

# ---------------------------------------------------------------------------
# Workflow binding
# ---------------------------------------------------------------------------
workflow:
  process: agile-spice-swe
  context:
    # SWE.4 tester must be independent from the developer → guards in YAML
    tester_independent: true

# ---------------------------------------------------------------------------
# LLM provider mapping
# Role names must match RoleSpec.name values in agile-spice-swe YAML.
# Format: provider/model  (copilot, ollama)
# ---------------------------------------------------------------------------
llm:
  roles:
    requirements_analyst: copilot/gpt-4o
    architect:            copilot/gpt-4o
    developer:            copilot/gpt-4o
    tester:               copilot/gpt-4o
    reviewer:             copilot/gpt-4o
    safety_engineer:      copilot/gpt-4o
  default: copilot/gpt-4o
  # Tier mapping for phase coordination workers (overrides roles when tier-based spawning is used)
  # Tier 1 = cheap/local  →  switch to ollama/llama3.2 when local GPU available
  # Tier 2 = capable      →  copilot/gpt-4o for most workers
  # Tier 3 = frontier     →  upgrade to anthropic/claude-opus-4-7 when API key available
  tiers:
    "1": copilot/gpt-4o
    "2": copilot/gpt-4o
    "3": copilot/gpt-4o

# ---------------------------------------------------------------------------
# Execution command mappings
# Keys match ExecutionStep.type values in agile-spice-swe.yaml.
# All commands run in working_dir (relative to base_dir = Soteria repo root).
# Adjust paths if the Soteria build system differs.
# ---------------------------------------------------------------------------
# NOTE: VulkanSC SDK is not available in the current build environment.
# Build/test commands use Python validators that verify structural readiness
# without requiring the SDK. Replace with real CMake/CTest commands once the
# VulkanSC SDK is installed.
# ---------------------------------------------------------------------------
execution:
  working_dir: "."  # Soteria repo root (= base_dir)
  timeout_seconds: 600
  commands: {}
  # NOTE: build, unit_test, integration_test, qualification_test, clang_format,
  # clang_tidy, and render_diagrams are all handled by MARS built-in validators.
  # They inspect the generated output folders and artifacts for quality and
  # completeness. No external tools or SDK required.
  # Add project-specific overrides here only if a real toolchain is available,
  # e.g.:
  #   build: "cmake --build build/ --config Release"
  #   unit_test: "ctest --test-dir build/ -C Release -R unit_"

# ---------------------------------------------------------------------------
# Context and artifact paths
# base_dir is relative to this file's directory (.mars/)
# All other paths are relative to base_dir (i.e. the Soteria repo root)
# ---------------------------------------------------------------------------
context:
  base_dir: ".."  # Soteria repo root

  # Context files available to every phase
  global_files:
    - README.md

  states:
    # ------------------------------------------------------------------
    # SWE.1 — Software Requirements Analysis
    # Human gate: SRS.md already written by Norbert Nopper.
    # The coordinator registers it without calling the LLM.
    # ------------------------------------------------------------------
    swe1_requirements:
      artifact: srs
      output: aspice/SWE.1/SRS.md
      preexisting: true
      context_files:
        - README.md

    # ------------------------------------------------------------------
    # SWE.2 — Software Architecture Design
    # Input: SRS.md
    # Output: SAD.md (Software Architecture Document)
    # ------------------------------------------------------------------
    swe2_architecture:
      artifact: sad
      output: aspice/SWE.2/SAD.md
      context_files:
        - aspice/SWE.1/SRS.md
        - engine/
        - CMakeLists.txt
      extra_context: |
        ISO 26262 ASIL-D requirements for software architecture (Part 6, clause 7):
        - Hierarchical software architecture with clearly defined interfaces
        - Safety requirements allocated to architectural elements with full traceability
        - No dynamic memory allocation / no recursion for safety-relevant paths (mandatory for ASIL-D)
        - Formal or semi-formal methods for architectural description recommended
        - Data flow and control flow analysis required
        - Each safety requirement must be traceable to an architectural component
        - Independence between safety-relevant and non-safety-relevant components must be enforced

    # ------------------------------------------------------------------
    # SWE.3 — Software Detailed Design and Unit Construction
    # Input: SAD.md + SRS.md
    # Output: DDD.md (Detailed Design Document)
    # Note: source_code is the EXISTING Soteria engine — preexisting, do not regenerate
    # ------------------------------------------------------------------
    swe3_detailed_design:
      artifact: ddd
      output: aspice/SWE.3/DDD.md
      extra_artifacts:
        - name: source_code
          output: engine/
          type: source_code
          preexisting: true   # Real Vulkan SC C++ already exists — DDD documents it
      context_files:
        - aspice/SWE.1/SRS.md
        - aspice/SWE.2/SAD.md
        - engine/
      extra_context: |
        The source code in `engine/` is ALREADY WRITTEN (real, existing C++ implementation).
        Your task for SWE.3 is to write DDD.md documenting the detailed design of that existing code.
        Do NOT generate new C++ files — the source_code artifact is preexisting.

        ISO 26262 ASIL-D requirements for detailed design (Part 6, clause 8):
        - Detailed design must be unambiguous, verifiable, and formally described
        - Defensive programming techniques mandatory for ASIL-D
        - Language subsets required: MISRA C++:2023 or equivalent safety coding standard
        - Each software unit must have documented purpose, inputs, outputs, error handling
        - Design must support unit-level testability with full traceability to unit tests
        - No hidden data flows; all globals and shared state must be explicitly documented

    # ------------------------------------------------------------------
    # SWE.4 — Software Unit Verification
    # Input: DDD.md + source_code
    # Output: UTR.md (Unit Test Report)
    # Note: tester_independent guard enforced by process YAML
    # ------------------------------------------------------------------
    swe4_unit_verification:
      artifact: utr
      output: aspice/SWE.4/UTR.md
      extra_artifacts:
        - name: unit_tests
          output: tests/unit/
          type: test_code
      context_files:
        - aspice/SWE.3/DDD.md
        - engine/core/result.hpp
        - engine/core/vksc_context.hpp
        - engine/core/safety_macros.hpp
        - engine/core/i_memory_allocator.hpp
        - engine/rendering/command_pool.hpp
        - engine/rendering/pipeline_cache.hpp
        - engine/rendering/swapchain.hpp
        - engine/rendering/frame_sync.hpp
        - engine/rendering/vertex_buffer.hpp
      extra_context: |
        ISO 26262 ASIL-D requirements for unit verification (Part 6, clause 9):
        - MC/DC (Modified Condition/Decision Coverage) mandatory for ASIL-D
        - Statement, branch, and MC/DC coverage must all be 100% for safety-relevant units
        - Unit tests must cover normal operation, boundary conditions, and all error cases
        - Tester must be fully independent from developer (separate team, ASIL-D requirement)
        - Test report must document: test cases, expected vs actual results, pass/fail, coverage achieved
        - Any deviations from coverage targets must be justified and safety-impact assessed

        C++ TEST CODE RULES (MANDATORY — violations cause compilation failure):
        - Framework: Google Test. Every test file must use #include <gtest/gtest.h>
        - Include paths: ALWAYS relative to project root. Examples:
            #include "engine/core/result.hpp"
            #include "engine/core/vksc_context.hpp"
            #include "engine/rendering/command_pool.hpp"
          NEVER write: #include "result.hpp"  or  #include "vksc_context.hpp"
        - Namespaces: ALL engine types live in namespace engine:: or engine::rendering::
            engine::Result, engine::VkscContext, engine::VkscContextConfig
            engine::rendering::CommandPool
          NEVER drop the namespace prefix.
        - Exceptions are DISABLED (-fno-exceptions). Do NOT use try/catch anywhere.
        - Only call methods that actually exist in the header files provided above.
          Read the headers carefully before writing tests.
        - Test functions use the TEST(SuiteName, CaseName) macro.
        - Assertions: EXPECT_EQ, EXPECT_TRUE, EXPECT_FALSE, EXPECT_NE, EXPECT_STREQ, etc.

        ORDERING REQUIREMENT (enforced by complete_phase):
        1. Write unit test C++ source files FIRST via store_files(artifact_name='unit_tests', ...)
           - Place tests in tests/unit/ with filenames matching the units under test
           - Each test must have a descriptive name, setup, assertions, and teardown
           - Cover EVERY public method in each header including error paths and boundary conditions
        2. THEN write UTR.md via store_artifact(name='utr', ...)
           - complete_phase will REJECT if unit_tests are not written first

    # ------------------------------------------------------------------
    # SWE.5 — Software Integration and Integration Test
    # Input: SAD.md + UTR.md
    # Output: ITR.md (Integration Test Report)
    # ------------------------------------------------------------------
    swe5_integration:
      artifact: itr
      output: aspice/SWE.5/ITR.md
      extra_artifacts:
        - name: integration_tests
          output: tests/integration/
          type: test_code
      context_files:
        - aspice/SWE.2/SAD.md
        - aspice/SWE.4/UTR.md
        - engine/core/result.hpp
        - engine/core/vksc_context.hpp
        - engine/rendering/command_pool.hpp
        - engine/rendering/swapchain.hpp
        - engine/rendering/frame_sync.hpp
      extra_context: |
        ISO 26262 ASIL-D requirements for integration testing (Part 6, clause 10):
        - Integration test must verify all interfaces between software units
        - Test environment must represent the target (Vulkan SC runtime on safety-critical hardware)
        - Full traceability: every architectural interface must have integration tests
        - Resource usage (memory, CPU, timing, stack depth) must be measured and within safety margins
        - Back-to-back testing recommended for ASIL-D (same test on model and code)
        - Test report must include pass/fail per test case and overall safety verdict

        C++ TEST CODE RULES (MANDATORY — violations cause compilation failure):
        - Framework: Google Test. Every test file must use #include <gtest/gtest.h>
        - Include paths: ALWAYS relative to project root. Examples:
            #include "engine/core/result.hpp"
            #include "engine/core/vksc_context.hpp"
            #include "engine/rendering/command_pool.hpp"
          NEVER write: #include "result.hpp"  or  #include "command_pool.hpp" (without path)
        - Namespaces: ALL engine types need the full prefix:
            engine::Result, engine::VkscContext, engine::VkscContextConfig
            engine::rendering::CommandPool
        - Exceptions are DISABLED (-fno-exceptions). Do NOT use try/catch.
        - Only call methods that actually appear in the headers provided above.
          VkscContext::Init takes (const VkscContextConfig&).
          CommandPool::Init takes (VkDevice, uint32_t queueFamilyIndex, VkDeviceSize reservedSizeBytes, uint32_t maxCommandBuffers).
          VK_NULL_HANDLE is a valid VkDevice for offline/mock tests — Init will return an error code.
        - Integration tests verify cross-component interactions; test that components fail gracefully
          with invalid inputs (VK_NULL_HANDLE device, nullptr appName, etc.).

        ORDERING REQUIREMENT (enforced by complete_phase):
        1. Write integration test C++ source files FIRST via store_files(artifact_name='integration_tests', ...)
           - Place tests in tests/integration/ testing cross-component interfaces from the SAD
           - Each test must initialise the components under test, call the interface, and assert outcomes
           - Cover every interface identified in the SAD component diagram
        2. THEN write ITR.md via store_artifact(name='itr', ...)
           - complete_phase will REJECT if integration_tests are not written first

    # ------------------------------------------------------------------
    # SWE.6 — Software Qualification Test
    # Input: SRS.md + ITR.md
    # Output: QTR.md (Qualification Test Report)
    # Human gate: qualification_passed trigger fires after human sign-off
    # ------------------------------------------------------------------
    swe6_qualification:
      artifact: qtr
      output: aspice/SWE.6/QTR.md
      extra_artifacts:
        - name: qualification_tests
          output: tests/qualification/
          type: test_code
      context_files:
        - aspice/SWE.1/SRS.md
        - aspice/SWE.5/ITR.md
        - aspice/SWE.2/SAD.md
        - aspice/SWE.3/DDD.md
        - engine/core/result.hpp
        - engine/core/vksc_context.hpp
        - engine/rendering/command_pool.hpp
      extra_context: |
        ISO 26262 ASIL-D requirements for software qualification testing (Part 6, clause 11):
        - Qualification test must demonstrate compliance with ALL software safety requirements from SRS
        - Test environment must be fully representative of production (Vulkan SC on target hardware)
        - Full bidirectional traceability: every SRS safety requirement → qualification test case(s)
        - ASIL-D independence: tester must be from a separate, independent team
        - Organisationally independent safety assessment required for ASIL-D
        - Final report must include: overall pass/fail verdict, open issues, deviations, safety argumentation
        - Human approval (sign-off gate) required before any release — ends this phase

        C++ TEST CODE RULES (MANDATORY — violations cause compilation failure):
        - Framework: Google Test. Every test file must use #include <gtest/gtest.h>
        - Include paths: ALWAYS relative to project root:
            #include "engine/core/result.hpp"
            #include "engine/core/vksc_context.hpp"
          NEVER: #include "vksc_context.hpp"
        - Namespaces: ALL types need engine:: prefix:
            engine::Result, engine::VkscContext, engine::VkscContextConfig, engine::IsOk
        - Exceptions are DISABLED. Do NOT use try/catch, throw, or <stdexcept>.
          Do NOT include <valgrind/valgrind.h> — this is cross-platform code.
        - Only call real methods from the headers above. VkscContext has:
            Init(const VkscContextConfig&) → engine::Result
            Shutdown()
            IsInitialised() → bool
            Device(), Instance(), PhysicalDevice(), GraphicsQueue() → Vulkan handles
          VkscContextConfig fields: appName, engineName, maxPhysicalDevices,
            instanceExtensions[], instanceExtensionCount, deviceExtensions[],
            deviceExtensionCount, resources (VkscResourceReservation), preferredDriverId.
          There is NO instanceConfig, NO deviceConfig, NO driverPreference, NO GetDriverId().
        - Each test file covers ONE SRS requirement (named SRS_INIT_001_test.cpp etc.)
        - Qualification tests verify system-level safety properties; use descriptive TEST names
          that reference the SRS requirement ID (e.g. TEST(SRS_INIT_001, NullAppNameReturnsError))
        - With VK_NULL_HANDLE / minimal config, Init() will return a non-kOk error — that is
          the expected behaviour for offline/mock testing and is VALID to assert.

        ORDERING REQUIREMENT (enforced by complete_phase):
        1. Write qualification test C++ source files FIRST via store_files(artifact_name='qualification_tests', ...)
           - Place tests in tests/qualification/ with one test file per SRS safety requirement
           - Each test must demonstrate compliance: invoke the system-level behaviour, assert the safety-relevant outcome
           - Every SRS safety requirement must have at least one qualification test
        2. THEN write QTR.md via store_artifact(name='qtr', ...)
           - complete_phase will REJECT if qualification_tests are not written first
